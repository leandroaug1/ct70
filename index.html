<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ERP CT70 LANMAR</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#eff3f6; --panel:#fff; --primary:#0a6ed1; --text:#32363a; --border:#d1dbe5; }
    body { font-family:'Inter', sans-serif; background:var(--bg); color:var(--text); margin:0; height:100vh; display:flex; overflow: hidden; }
    
    .sidebar { width:250px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; transition: 0.3s; position: relative; }
    .sidebar.collapsed { width: 70px; }
    .sidebar.collapsed .brand-text { display: none; }
    .brand { height:64px; display:flex; align-items:center; padding:0 24px; color:var(--primary); font-weight:700; border-bottom:1px solid var(--border); gap:12px; white-space: nowrap; overflow: hidden; }
    
    .toggle-btn { position: absolute; bottom: 20px; right: -15px; background: var(--primary); color: #fff; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid var(--bg); z-index: 10; transition: 0.3s; }
    .sidebar.collapsed .toggle-btn { transform: rotate(180deg); right: 20px; }

    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .header { height:64px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 32px; }
    .content { padding:32px; overflow-y:auto; flex:1; }
    
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:20px; margin-bottom:30px; }
    .card { background:var(--panel); padding:20px; border-radius:8px; border:1px solid var(--border); text-align: center; cursor: pointer; transition: 0.2s; }
    .card.active { border: 2px solid var(--primary); background: #f0f7ff; transform: translateY(-3px); }
    .kpi-val { font-size: 2.2em; font-weight: 800; margin-top: 8px; }
    
    .grid { background:var(--panel); border-radius:8px; border:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column; height:calc(100vh - 320px); }
    .toolbar { padding:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap: 15px; background: #fafbfc; }
    .filter-group { display: flex; gap: 10px; align-items: center; }
    
    select.sort-select { padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: white; outline: none; font-size: 13px; color: var(--text); cursor: pointer; }
    
    .table-box { overflow:auto; flex:1; }
    table { width:100%; border-collapse:collapse; font-size:13px; white-space:nowrap; }
    th { background:#f7f9fb; padding:12px 20px; text-align:left; position:sticky; top:0; border-bottom:1px solid var(--border); color:#6a7682; font-weight:600; font-size:11px; text-transform:uppercase; z-index: 1; }
    td { padding:12px 20px; border-bottom:1px solid #edf2f7; }
    tr:hover { background:#f8fafc; }
    tr.valid { background:#f6fffa; color:#137333; }

    .btn { padding:8px 16px; border-radius:4px; font-weight:600; font-size:13px; cursor:pointer; border:1px solid transparent; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-outline { background:#fff; border-color:var(--border); color:#6a7682; }

    #loader { position:fixed; inset:0; background:rgba(255,255,255,0.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; }
    .spinner { width:40px; height:40px; border:4px solid #eee; border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
</head>
<body>
  <div id="loader"><div class="spinner"></div><p style="margin-top:15px;color:#666;font-weight:600">SINCRONIZANDO ERP CT70 LANMAR...</p></div>
  
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <span class="material-icons-round">analytics</span>
      <span class="brand-text">ERP CT70 LANMAR</span>
    </div>
    <div class="toggle-btn" onclick="toggleSidebar()">
      <span class="material-icons-round">chevron_left</span>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div style="background:#f2f4f7; padding:8px 16px; border-radius:6px; display:flex; align-items:center; width:400px;">
        <span class="material-icons-round" style="color:#999">search</span>
        <input id="search" style="border:none; background:transparent; margin-left:10px; width:100%; outline:none;" placeholder="Pesquisar por palavra..." onkeyup="applyFilters()">
      </div>
      <div style="font-weight:600; font-size:13px">Admin User</div>
    </div>

    <div class="content">
      <div class="kpi-grid">
        <div class="card active" id="card-all" onclick="setKpiFilter('all', this)" style="border-top:4px solid var(--primary)">
          <div style="font-size:11px; font-weight:700; color:#666">TOTAL GERAL</div>
          <div id="k-total" class="kpi-val">0</div>
        </div>
        <div class="card" id="card-valid" onclick="setKpiFilter('valid', this)" style="border-top:4px solid #107e3e">
          <div style="font-size:11px; font-weight:700; color:#666">VALIDADOS</div>
          <div id="k-valid" class="kpi-val" style="color:#107e3e">0</div>
        </div>
        <div class="card" id="card-pend" onclick="setKpiFilter('pend', this)" style="border-top:4px solid #e9730c">
          <div style="font-size:11px; font-weight:700; color:#666">PENDENTES</div>
          <div id="k-pend" class="kpi-val" style="color:#e9730c">0</div>
        </div>
      </div>
      
      <div class="grid">
        <div class="toolbar">
          <div class="filter-group">
            <h3 style="margin:0;font-size:14px;color:#666">Ordenação:</h3>
            <select id="sortOrder" class="sort-select" onchange="applyFilters()">
              <option value="none">Padrão Planilha</option>
              <option value="az">Ordem (A-Z)</option>
              <option value="za">Ordem (Z-A)</option>
              <option value="perm_desc">Maior Permanência</option>
              <option value="perm_asc">Menor Permanência</option>
            </select>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-outline" onclick="load()">Refresh</button>
            <button class="btn btn-primary" onclick="validateSelection()">Validar Seleção</button>
          </div>
        </div>
        <div class="table-box">
          <table id="table">
            <thead>
              <tr>
                <th width="40"><input type="checkbox" onchange="toggleAll(this)"></th>
                <th>Ordem</th><th>Status Final</th><th>Obs. Fluxo</th><th>Resp.</th><th>Perm.</th><th>Status</th><th>Ações</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div id="empty" style="display:none;padding:50px;text-align:center;color:#999">Nenhum registro encontrado.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw0QOu3LojG65Czx0V1uQ_zN7gmkw4bKnEXO3OSWGzATmjiwv6Fou2OsluqgEkqzItu/exec"; 
    let fullData = [];
    let currentKpiFilter = 'all';

    window.onload = load;

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

    async function load() {
      loading(true);
      try {
        const response = await fetch(API_URL, { 
          method: 'POST', 
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'GET_DASHBOARD' }) 
        });
        const json = await response.json();
        fullData = json.data;
        updateKpis();
        applyFilters();
      } catch(e) { console.error("Erro ao carregar:", e); }
      loading(false);
    }

    function updateKpis() {
      document.getElementById('k-total').innerText = fullData.length;
      document.getElementById('k-valid').innerText = fullData.filter(x => x.isValidado).length;
      document.getElementById('k-pend').innerText = fullData.filter(x => !x.isValidado).length;
    }

    function setKpiFilter(filter, el) {
      currentKpiFilter = filter;
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const searchTerm = document.getElementById('search').value.toLowerCase();
      const sortVal = document.getElementById('sortOrder').value;
      
      let filtered = [...fullData];

      if (currentKpiFilter === 'valid') filtered = filtered.filter(x => x.isValidado);
      if (currentKpiFilter === 'pend') filtered = filtered.filter(x => !x.isValidado);

      if (searchTerm) {
        filtered = filtered.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(searchTerm)));
      }

      if (sortVal === 'az') filtered.sort((a, b) => String(a.id).localeCompare(String(b.id)));
      if (sortVal === 'za') filtered.sort((a, b) => String(b.id).localeCompare(String(a.id)));
      if (sortVal === 'perm_desc') filtered.sort((a, b) => (Number(b.permanencia) || 0) - (Number(a.permanencia) || 0));
      // LÓGICA NOVA: Menor Permanência
      if (sortVal === 'perm_asc') filtered.sort((a, b) => (Number(a.permanencia) || 0) - (Number(b.permanencia) || 0));

      render(filtered);
    }

    function render(rows) {
      const tb = document.getElementById('tbody');
      tb.innerHTML = '';
      document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        if(r.isValidado) tr.className = 'valid';
        tr.innerHTML = `
          <td><input type="checkbox" class="chk" value="${r.id}"></td>
          <td style="font-weight:700">${r.id}</td>
          <td>${r.statusFinal}</td>
          <td>${r.isValidado ? '✓ Validado' : r.obsFluxo}</td>
          <td>${r.responsavel}</td>
          <td>${r.permanencia}</td>
          <td style="color:var(--primary);text-decoration:underline;cursor:pointer" onclick="editStatus('${r.id}','${r.status}')">${r.status || 'Editar'}</td>
          <td><span style="color:#bb0000;cursor:pointer" onclick="deleteTicket('${r.id}')">✕</span></td>
        `;
        tb.appendChild(tr);
      });
    }

    async function validateSelection() {
      const ids = [...document.querySelectorAll('.chk:checked')].map(c => c.value);
      if(!ids.length) return alert("Selecione itens.");
      loading(true);
      await fetch(API_URL, { method:'POST', body: JSON.stringify({action:'VALIDATE_TICKET', data:{ids}}) });
      load();
    }

    function toggleAll(src) { document.querySelectorAll('.chk').forEach(c => c.checked = src.checked); }
    function loading(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
  </script>
</body>
</html>
